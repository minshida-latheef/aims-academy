<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | AIMS Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="brand-logo">AIMS <span>ACADEMY</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="course-grid.html">Courses</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="blog-details.html">Blog</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-banner">
    <h1>Contact Us</h1>
    <p>Get in Touch for Admissions & Inquiries</p>
  </div>

  <section class="container" style="max-width: 600px;">
    <form class="card" style="display: flex; flex-direction: column; gap: 1rem;">
      <label style="font-weight: 600;">Full Name</label>
      <input type="text" placeholder="Enter your name" required style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins';">
      
      <label style="font-weight: 600;">Email Address</label>
      <input type="email" placeholder="Enter your email" required style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins';">
      
      <label style="font-weight: 600;">Message / Course Interest</label>
      <textarea rows="4" placeholder="How can we help you?" required style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins';"></textarea>
      
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 <span>AIMS Academy</span>. All Rights Reserved.</p>
  </footer>
</body>
</html>
